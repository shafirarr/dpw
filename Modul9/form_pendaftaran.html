<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Mahasiswa</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #eef2f3; padding: 40px 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #34495e; }
        
        input[type="text"], input[type="email"], input[type="date"], textarea {
            width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 8px; box-sizing: border-box;
        }
        
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        
        button { 
            width: 100%; padding: 12px; background: #3498db; color: white; border: none; 
            border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; 
            transition: 0.3s;
        }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

<div class="card">
    <h2>Pendaftaran Mahasiswa</h2>
    <form action="proses_pendaftaran.php" method="post">
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" name="nama" required>
        </div>
        <div class="form-group">
            <label>NIM</label>
            <input type="text" name="nim" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Tempat, Tanggal Lahir</label>
            <input type="text" name="tempat" placeholder="Tempat" style="margin-bottom:5px;" required>
            <input type="date" name="ttl" required>
        </div>
        <div class="form-group">
            <label>Alamat Rumah</label>
            <textarea name="alamat" rows="3" required></textarea>
        </div>
        <div class="form-group">
            <label>Jenis Kelamin</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="Laki-laki" required> Laki-laki</label>
                <label><input type="radio" name="gender" value="Perempuan"> Perempuan</label>
            </div>
        </div>
        <button type="submit">Daftar Sekarang</button>
    </form>
</div>

</body>
</html>
